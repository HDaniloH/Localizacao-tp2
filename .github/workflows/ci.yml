name: CI - Backend Qualidade e Testes

on:
  push:
    branches: [main, SubMain]
  pull_request:
    branches: [main, SubMain]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tp2_user
          POSTGRES_PASSWORD: tp2_password
          POSTGRES_DB: ocorrencias_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar formatação (Black) e PEP 8 (Flake8)
        run: |
          black --check app tests
          flake8 app tests

      - name: Análise estática de segurança (Bandit)
        run: bandit -r app

      - name: Executar testes e validar cobertura mínima de 80%
        env:
          DATABASE_URL: postgresql://tp2_user:tp2_password@localhost:5432/ocorrencias_db
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
