services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tp2_ocorrencias_db
    restart: always
    environment:
      POSTGRES_USER: tp2_user
      POSTGRES_PASSWORD: tp2_password
      POSTGRES_DB: ocorrencias_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
